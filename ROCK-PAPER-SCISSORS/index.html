<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👊✋✌️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
</head>

<body>
    <h1 class="game-name">Rock-Paper-Scissor</h1>
    <div class="choices">
        <div id="rock">
            <img src="images/rock.png" alt="rock" class="choice">
        </div>
        <div id="paper">
            <img src="images/paper.png" alt="paper" class="choice">
        </div>
        <div id="scissor">
            <img src="images/scissor.png" alt="scissor" class="choice">
        </div>
    </div>
    <div class="score-board">
        <div class="player-score">
            <p class="p-score">0</p>
            <h2>You</h2>
        </div>
        <div class="comp-score">
            <p class="c-score">0</p>
            <h2>Bot</h2>
        </div>
    </div>
    <div class="ready">
        <p>Select Your Choice</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
